name: Build & Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: OMNIROUTE_USE_TURBOPACK=0 npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .build/next/
